[phases.setup]
nixPkgs = ["php84", "php84Extensions.zip", "php84Extensions.gd", "php84Extensions.mbstring", "php84Extensions.xml", "php84Packages.composer", "nodejs_22", "npm-check-updates"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --ignore-platform-reqs",
    "npm ci",
]

[phases.build]
cmds = [
    "npm run build",
    "rm -rf node_modules",
    "mkdir -p storage/framework/{cache/data,sessions,views}",
    "mkdir -p storage/app/private/{reports,uploads}",
    "mkdir -p bootstrap/cache",
]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
